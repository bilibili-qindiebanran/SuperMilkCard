; PlatformIO 工程配置
; 目标：ESP32-S3 + ESP-IDF 框架，通过 I2C 与 IP5306-I2C 电源管理芯片通讯
;
; 首次编译时 PlatformIO 会自动联网安装 espressif32 平台与 ESP-IDF 工具链
; （体积较大、耗时较长，属正常现象）。

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; 实际板子 Flash 为 2MB（该板型默认 8MB 会告警，此处按实际硬件覆盖）
board_build.flash_size = 2MB
board_upload.flash_size = 2MB

; IP5306 I2C 引脚配置（SDA=GPIO9, SCL=GPIO10，按实际接线设置）
; 如接线不同，修改这两个宏即可
build_flags =
    -D IP5306_PIN_SDA=9
    -D IP5306_PIN_SCL=10

; 串口监视器波特率
monitor_speed = 115200
