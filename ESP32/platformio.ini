; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
build_flags = 
	-D IP5306_PIN_SDA=9
	-D IP5306_PIN_SCL=10
	; I2S 音频引脚（麦克风 ICS-43434 + 功放 MAX98357A）
	-D I2S_AUDIO_BCLK=17
	-D I2S_AUDIO_WS=8
	-D I2S_AUDIO_DIN=18
	-D I2S_AUDIO_DOUT=7
	-D I2S_AUDIO_SPKMODE=6
; 注意：build_type=debug(-Og) 会触发 gcc 15.2.0 在 esp_lcd_panel_rgb.c 的
; 确定性编译崩溃（internal compiler error: Segmentation fault）。
; 暂用默认 release 模式保证可编译烧录；如需断点调试，需换老版本工具链后再说。
; build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak app_main
monitor_speed = 115200
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419
