; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
; 实际模块：ESP32-S3-WROOM-1-N16R8 = 16MB Flash + 8MB Octal PSRAM
; 单 app 分区 4MiB（Wi-Fi + 配网页 + TCP 服务端 + 后续字体/资源），见 partitions_16mb_4m.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb_4m.csv
build_flags = 
	-D IP5306_PIN_SDA=9
	-D IP5306_PIN_SCL=10
	; I2S 音频引脚（麦克风 ICS-43434 + 功放 MAX98357A）
	-D I2S_AUDIO_BCLK=17
	-D I2S_AUDIO_WS=8
	-D I2S_AUDIO_DIN=18
	-D I2S_AUDIO_DOUT=7
	-D I2S_AUDIO_SPKMODE=6
	; QSPI 屏幕 ST77926（3.5寸 320x480）+ 电容触摸（共用 I2C0）+ AW9364DNR 背光
	; 触摸 SDA/SCL(9/10) 与 IP5306 共用 I2C0 总线
	; 注意：TE=IO11, CS=IO12, SCLK=IO13, IO0=IO14, IO1=IO21, IO2=IO47, IO3=IO48
	-D LCD_PIN_TP_SDA=9
	-D LCD_PIN_TP_SCL=10
	-D LCD_PIN_TE=11
	-D LCD_PIN_CS=12
	-D LCD_PIN_SCLK=13
	-D LCD_PIN_D0=14
	-D LCD_PIN_D1=21
	-D LCD_PIN_D2=47
	-D LCD_PIN_D3=48
	-D LCD_PIN_TP_INT=39
	-D LCD_PIN_BL_EN=40
	-D LCD_PIN_RESET=41
	-D LCD_PIN_TP_RST=42
; 注意：build_type=debug(-Og) 会触发 gcc 15.2.0 在 esp_lcd_panel_rgb.c 的
; 确定性编译崩溃（internal compiler error: Segmentation fault）。
; 暂用默认 release 模式保证可编译烧录；如需断点调试，需换老版本工具链后再说。
; build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak app_main
monitor_speed = 115200
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419
